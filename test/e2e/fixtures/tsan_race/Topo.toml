# tsan_race — forced-parallel variant with a WRONG declaration, built with the
# checker explicitly OFF. This is the exact hole the ThreadSanitizer backstop
# lane exists for: a user opts out of check (check = "off" / --no-check) while
# declaring [parallel] mode = "force" over host code that is not actually
# parallel-safe. TopoParallelPass trusts the declaration and spawns the racy
# work concurrently with no static diagnostic anywhere.
#
# ThreadSanitizer is requested via the [build.cpp].flags passthrough below,
# which reaches BOTH the compile-to-IR and the link clang invocations of a
# plain-cpp build (TSan needs it at both; the cpp_flags e2e lane proves that
# transport). -g is already supplied by the driver's default dev build mode,
# so the TSan report carries source locations.

[project]
name = "tsan_race"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
standard = "c++17"
output = "tsan_race"
check = "off"

[build.cpp]
flags = ["-fsanitize=thread"]

[parallel]
mode = "force"
