# tsan_race — forced-parallel variant with a WRONG declaration, built with the
# checker explicitly OFF. This is the exact hole the ThreadSanitizer backstop
# lane exists for: a user opts out of check (check = "off" / --no-check) while
# declaring [parallel] mode = "force" over host code that is not actually
# parallel-safe. TopoParallelPass trusts the declaration and spawns the racy
# work concurrently with no static diagnostic anywhere.
#
# ThreadSanitizer is NOT requested here via a [build.cpp] flags array: that
# clang-flags passthrough is parsed only for [build].language = "mixed"
# (topo-cli Config.cpp), so for a plain cpp project a flags array would be
# silently ignored and reach neither the compile nor the link step. The e2e
# test (TsanBackstopTests.cpp) instead injects -fsanitize=thread into every
# clang invocation — both the compile-to-IR and the link — via the
# CCC_OVERRIDE_OPTIONS env var, which covers compile and link with one knob.
# -g is already supplied by the driver's default dev build mode, so the TSan
# report carries source locations.

[project]
name = "tsan_race"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
standard = "c++17"
output = "tsan_race"
check = "off"

[parallel]
mode = "force"
