[project]
name = "hints"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "hints"

[parallel]
mode = "auto"
min_tasks_to_parallelize = 2

[optimize.data-layout]
mode = "soa"

[optimize.prefetch]
mode = "auto"
distance = 64

# Benchmark scaffolding and toolchain runtime symbols (topo::*/topo_*/__topo_*)
# are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = [
    "topo::*",
    "topo_*",
    "__topo_*",
    "benchmark",
    "friendly_work",
    "unfriendly_work",
]
