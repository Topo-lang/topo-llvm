[project]
name = "hints"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "hints_base"

[parallel]
mode = "off"

[optimize.data-layout]
mode = "off"

[optimize.prefetch]
mode = "off"
