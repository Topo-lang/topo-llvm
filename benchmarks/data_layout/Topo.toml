[project]
name = "data_layout_perf"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "data_layout_perf"

[builder]
mode = "aggressive"

[optimize.data-layout]
mode = "auto"

# Benchmark scaffolding and toolchain runtime symbols (topo::*/topo_*/__topo_*)
# are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = [
    "topo::*",
    "topo_*",
    "__topo_*",
    "Particle",
    "benchmark",
    "idx",
    "init_particles",
    "make_random_indices",
    "unfriendly_work",
]
