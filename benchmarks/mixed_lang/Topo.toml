[project]
name = "mixed_lang"

[topo]
root = "topo/main.topo"

[build]
language = "mixed"
output = "mixed_lang"
# No checker is registered for mixed C++/Rust (topo-check exits "no language
# plugin"); topo-build auto-skips the check phase under "auto" already.
check = "off"

[build.cpp]
sources = ["src/*.cpp"]
include = ["include"]

[build.rust]
manifest = "rust_lib/Cargo.toml"
