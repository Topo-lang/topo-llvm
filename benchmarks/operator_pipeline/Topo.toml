[project]
name = "operator_pipeline"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "operator_pipeline"

[parallel]
mode = "off"

[adaptive]
mode = "off"

[optimize.data-layout]
mode = "off"

[optimize.indirection]
mode = "off"

[observability]
mode = "off"

[lifetime]
mode = "off"

[loop_parallel]
mode = "off"

# Benchmark scaffolding and toolchain runtime symbols (topo::*/topo_*/__topo_*)
# are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = [
    "topo::*",
    "topo_*",
    "__topo_*",
    "math::Vec2",
    "math::offset",
]
