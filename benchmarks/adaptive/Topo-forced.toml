[project]
name = "adaptive_parallel"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "adaptive_forced"
embed_ir = true
link_libs = ["topo-adaptive", "topo-parallel", "topo-jit", "TopoPlatform"]

[parallel]
mode = "force"
min_tasks_to_parallelize = 2
instrument = true

[adaptive]
mode = "force"
