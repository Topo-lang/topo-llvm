[project]
name = "auxiliary_types"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "auxiliary_types"

# Benchmark scaffolding and toolchain runtime symbols (topo::*/topo_*/__topo_*)
# are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = [
    "topo::*",
    "topo_*",
    "__topo_*",
    "aux::s",
    "benchmark",
    "friendly_work",
    "full",
    "s",
    "unfriendly_work",
]
