[project]
name = "loop_reduction"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "loop_reduction"

[parallel]
mode = "force"
min_tasks_to_parallelize = 2

[loop_parallel]
mode = "force"
partition = true
reduction = true

# Benchmark scaffolding and toolchain runtime symbols (topo::*/topo_*/__topo_*)
# are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = ["topo::*", "topo_*", "__topo_*"]
