[project]
name = "observability_rust"

[topo]
root = "topo/main.topo"

[build]
language = "rust"
sources = ["src"]
output = "observability_rust"

[observability]
mode = "force"
exporter = "stdout"

# Benchmark scaffolding and toolchain runtime symbols (topo::*/topo_*/__topo_*)
# are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = ["topo::*", "topo_*", "__topo_*"]
