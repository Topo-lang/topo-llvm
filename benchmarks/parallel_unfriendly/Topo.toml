[project]
name = "parallel_unfriendly"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "parallel_unfriendly"
link_libs = ["topo-parallel"]

[parallel]
mode = "auto"

# Benchmark scaffolding and toolchain runtime symbols (topo::*/topo_*/__topo_*)
# are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = [
    "topo::*",
    "topo_*",
    "__topo_*",
    "benchmark",
    "heavy_work",
    "light_work",
    "unfriendly_work",
]
