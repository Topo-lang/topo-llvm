[project]
name = "observability"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include", "../../../topo-lang-cpp/runtime/include", "../../runtime/include"]
standard = "c++17"
output = "observability"

[observability]
mode = "auto"
exporter = "stdout"
sampling_rate = 1.0
