[project]
name = "ownership_friendly"

[topo]
root = "topo/main.topo"

[build]
sources = ["src/*.cpp"]
include = ["include"]
standard = "c++17"
output = "ownership_friendly"

[optimize.indirection]
mode = "auto"

# Benchmark scaffolding symbols are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = ["Node", "bench", "friendly_work"]
