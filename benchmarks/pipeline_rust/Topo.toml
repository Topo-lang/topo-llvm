[project]
name = "pipeline_rust"

[topo]
root = "topo/main.topo"

[build]
language = "rust"
sources = ["src"]
output = "pipeline_rust"

# Benchmark scaffolding symbols are outside the .topo contract.
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = ["friendly_work", "unfriendly_work"]
