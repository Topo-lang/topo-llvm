name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly deterministic e2e gate. 18:03 UTC — staggered off topo-jvm's :43
  # and the meta's :23. The benchmark + e2e (linux) job runs the deterministic
  # equivalence + pass-fired suite (timing benches stay manual / workflow_dispatch
  # only — they are 40-90 min and flaky on shared runners), so the nightly is
  # bounded and not subject to timing-suite hangs. Scheduled runs only ever use
  # the workflow file on the default branch.
  schedule:
    - cron: '3 18 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # TOPO_CORE_REF / TOPO_LANG_CPP_REF (and the benchmark job's TOPO_CLI_REF /
  # TOPO_LANG_RUST_REF) are temporarily pinned to dev: the [build.cpp].flags
  # chain (BuildConfig::cppFlags) lands across topo-core / topo-cli /
  # topo-lang-cpp in lockstep. Restore to main once those merge.
  TOPO_CORE_REF: dev
  # topo-llvm core links topo::core::TopoBuildLib (lib/Build) which is
  # gated behind find_package(topo-lang) in topo-core. Install topo-lang
  # too so the topo-core re-install includes lib/Build in its export.
  TOPO_LANG_REF: main
  # topo-llvm's C-ABI runtime libs (runtime/topo_jit_api.cpp,
  # topo_adaptive.cpp, topo_parallel.cpp, ...) #include <topo/jit.h>,
  # <topo/parallel.h>, <topo/adaptive.h> — these headers physically live
  # in topo-lang-cpp/runtime/include/topo/ and are always installed under
  # the default scope. find_path(TOPO_LANG_CPP_RUNTIME_INCLUDE) in
  # topo-llvm/CMakeLists.txt picks them up from the install prefix.
  TOPO_LANG_CPP_REF: dev

jobs:
  # ── Core scope build + test ────────
  # Builds the LLVM IR pass + Backend + Decompile + JitEngine + C-ABI
  # runtime libs (the topo-llvm core scope landed in the phase-4 lift).
  # Backend tools (topo-build-llvm-{cpp,rust,mixed}) live behind
  # TOPO_LLVM_BUILD_TOOLS=ON and reverse-link topo-lang-cpp / -rust's
  # LLVM scope; not exercised here to keep CI scope manageable.
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macos-14 uses Homebrew llvm@22 instead of the bundled tarball:
        # bundled `LLVM-22.1.1-macOS-ARM64.tar.xz` clang aborts during
        # cmake's compiler check with `dyld: Symbol not found: __ZdaPv →
        # Abort trap: 6` (libc++ ABI mismatch). Brew-installed llvm@22
        # links against the runner's libc++ and works. The bundled-LLVM
        # download/cache steps below are skipped on macOS, and topo-llvm's
        # cmake/llvm-detect.cmake auto-prefers brew llvm@<major> when
        # llvm-dev/ is absent. Apple clang from Xcode CLT drives cmake's
        # compiler probe (the bundled-clang auto-pick in CMakeLists.txt:7
        # is gated on EXISTS llvm-dev/bin/clang++).
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja llvm@22

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Read LLVM version
        id: llvm-ver
        run: echo "version=$(tr -d '[:space:]' < .llvm-version)" >> "$GITHUB_OUTPUT"

      # The bundled LLVM tarball is ~1 GB; caching it keeps PR builds
      # workable. Keyed on .llvm-version so a version bump invalidates.
      # Skipped on macOS — Homebrew llvm@22 is used instead (see matrix
      # comment above); bundled clang ABI is incompatible with the
      # macos-14 runner's libc++.
      - name: Cache bundled LLVM
        if: runner.os != 'macOS'
        id: llvm-cache
        uses: actions/cache@v5
        with:
          path: llvm-dev
          key: llvm-dev-${{ steps.llvm-ver.outputs.version }}-${{ matrix.os }}-v1

      - name: Download bundled LLVM
        if: runner.os != 'macOS' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup-llvm.sh

      # ABI + CRT consistency (Windows): pin the upstream topo-core/-lang/-lang-cpp
      # builds to the SAME bundled clang AND the SAME static CRT topo-llvm uses.
      # (1) Without the clang pin, the runner's mingw toolchain (ahead on PATH)
      #     builds topo-core into GNU-ABI libTopo*.a (Itanium mangling) while
      #     topo-llvm builds MSVC-ABI .lib — lld-link then can't resolve topo-core
      #     C++ symbols (the C-ABI library link worked, masking it).
      # (2) topo-llvm + the bundled LLVM use the static CRT (/MT, libcmt); a
      #     clang-msvc default build of topo-core is /MD (dynamic), so lld-link
      #     hits `/failifmismatch RuntimeLibrary`. CMAKE_MSVC_RUNTIME_LIBRARY=
      #     MultiThreaded forces /MT for the upstream builds to match.
      # CC/CXX are read by every subsequent topo-* cmake configure; TOPO_WIN_CMAKE
      # is appended to each (empty off-Windows). vcpkg's nlohmann_json/tomlplusplus
      # are header-only, so they contribute no CRT of their own.
      - name: Pin bundled clang + static CRT for upstream builds (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "CC=${{ github.workspace }}/llvm-dev/bin/clang.exe" >> "$GITHUB_ENV"
          echo "CXX=${{ github.workspace }}/llvm-dev/bin/clang++.exe" >> "$GITHUB_ENV"
          echo "TOPO_WIN_CMAKE=-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> "$GITHUB_ENV"

      - name: Cache upstream installs
        id: upstream-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          # v5: upstream rebuilt with the bundled clang + static CRT on Windows
          # (ABI + RuntimeLibrary fix); earlier GNU-ABI / dynamic-CRT installs
          # must not be reused.
          # v7: topo-core BuildConfig gained cppFlags + topo-lang-cpp's
          # CppDriver consumes it; the backend tools' main.cpp references the
          # new field, so a stale cached install header no longer compiles.
          # v8: the dev-pinned upstream tips advanced (fix batch merged to
          # core/cpp/cli dev); the key interpolates the refs, not their
          # content — force the fresh clone.
          key: topo-upstream-${{ env.TOPO_CORE_REF }}-${{ env.TOPO_LANG_REF }}-${{ env.TOPO_LANG_CPP_REF }}-${{ matrix.os }}-v8-crt

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      # Re-install topo-core to flip TOPO_CORE_WITH_LANG ON now that
      # topo-lang is discoverable in the prefix. This wires lib/Build +
      # lib/Transpile (PUBLIC-dep on topo::lang::TopoLang) into the
      # TopoCoreTargets export set, which topo-llvm core needs
      # (TopoBackend links topo::core::TopoBuildLib).
      - name: Re-install topo-core (with-lang)
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      # Install topo-lang-cpp at its default scope (ENABLE_LLVM=OFF) — we
      # only need its runtime/include/topo/ headers (parallel.h, jit.h,
      # adaptive.h, ...) which the topo-llvm C-ABI runtime libs include.
      - name: Build & install topo-lang-cpp (default scope)
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git \
              "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" \
                -B "${RUNNER_TEMP}/topo-lang-cpp-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-build" --target install

      - name: Configure topo-llvm (core scope, tools=OFF)
        run: |
          # All three platforms: BUILD_TESTS=ON + BUILD_JIT_ENGINE=ON on their
          # supported LLVM source. Linux/Windows use the bundled LLVM tarball;
          # macOS uses Homebrew llvm@22 (the bundled-tarball macOS path is
          # ABI-incompatible — see the bundled-clang probe job below — but the
          # supported brew path builds + tests the ~400 cases + JIT engine
          # cleanly, verified 400/400 locally on macos-14 with brew libLLVM
          # 22.1.x + system libc++). Linux uses the --start-group/--end-group
          # wrapper for the TopoTransforms↔TopoBackend cycle.
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LLVM_BUILD_JIT_ENGINE=ON \
              -DTOPO_LLVM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      # ~400 unit + integration tests; e2e suite excluded (needs topo-build
      # CLI from topo-cli + the deferred benchmark/e2e fixture trees).
      - name: Test
        # All three platforms run the ~400 unit + integration cases (incl. the
        # 14 jit + 14 adaptive JIT-engine cases). No --no-tests=ignore, so a
        # 0-tests build FAILS (real coverage check) — no silent 0-tests green.
        run: ctest --test-dir build -E "e2e" --output-on-failure --timeout 180

      - name: Install topo-llvm
        run: cmake --install build --prefix "${RUNNER_TEMP}/llvm-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          # The smoke project needs its own vcpkg manifest: the installed
          # package's Config.cmake chain transitively requires nlohmann_json,
          # so the consumer must arrange for that dep itself. Pinning the
          # same builtin-baseline reuses the cached vcpkg build.
          cat > vcpkg.json <<'JSON'
          {
            "name": "find-package-smoke",
            "version-string": "0.0.0",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          # Enable C as well: on macOS, brew llvm's LLVMConfig.cmake
          # transitively find_package(LibEdit), and FindLibEdit calls
          # check_include_file(histedit.h ...) which requires C enabled.
          project(topo-llvm-find-package-smoke LANGUAGES C CXX)
          find_package(topo-llvm CONFIG REQUIRED)
          add_executable(smoke smoke.cpp)
          # topo-arena is a pure C-ABI archive — links cleanly without
          # dragging the LLVM static archives the pass libraries pull in.
          target_link_libraries(smoke PRIVATE topo::llvm::topo-arena)
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include <topo/rt/arena_rt.h>
          int main() {
              topo_arena_t a = topo_arena_create(1024);
              topo_arena_destroy(a);
              return 0;
          }
          CPP
          # On Windows the GHA runner's PATH puts mingw64 ld ahead of
          # MSVC's link.exe, and CMake's Ninja generator silently picks
          # the first one for an unspecified CXX. topo-arena.lib was
          # built with MSVC-ABI clang from llvm-dev/, so mingw64 ld
          # can't resolve operator new/delete (??2@YAPEAX_K@Z etc).
          # Pin the smoke project to the same bundled clang the upstream
          # build used.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            CC_FLAG="-DCMAKE_C_COMPILER=${{ github.workspace }}/llvm-dev/bin/clang.exe"
            CXX_FLAG="-DCMAKE_CXX_COMPILER=${{ github.workspace }}/llvm-dev/bin/clang++.exe"
            LLVM_PREFIX="${{ github.workspace }}/llvm-dev"
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            # macOS uses Homebrew llvm@22 instead of the bundled tarball
            # (see matrix comment at top); point find_dependency(LLVM) at it.
            CC_FLAG=""
            CXX_FLAG=""
            LLVM_PREFIX="$(brew --prefix llvm@22)"
          else
            CC_FLAG=""
            CXX_FLAG=""
            LLVM_PREFIX="${{ github.workspace }}/llvm-dev"
          fi
          cmake -S . -B build -G Ninja \
              ${CC_FLAG} ${CXX_FLAG} \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/llvm-install;${RUNNER_TEMP}/topo-install;${LLVM_PREFIX}" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          ./build/smoke

  # ── Benchmark + e2e gate (schedule + manual only) ──────
  # The 41 LLVM-IR pass benchmarks + the IR/output-equivalence suite. Gated
  # to schedule / workflow_dispatch so it never adds its tens of minutes to a
  # PR. Heavier bootstrap than build-and-test: the e2e artifacts are built by
  # topo-cli's `topo-build`, and TOPO_LLVM_BUILD_TOOLS (topo-build-llvm-mixed)
  # reverse-links topo-lang-cpp / -rust's LLVM scope — the cpp/rust↔llvm
  # gating loop. We break it the way the bootstrap order prescribes
  # (llvm core → lang-cpp/-rust with ENABLE_LLVM → llvm tools):
  #   1. topo-core + topo-lang + topo-lang-cpp at DEFAULT scope (the runtime
  #      headers topo-llvm's C-ABI libs include; all LLVM-independent).
  #   2. topo-llvm CORE from THIS checkout → install, so lang-cpp/-rust's
  #      find_package(topo-llvm) resolves.
  #   3. lang-cpp + lang-rust with ENABLE_LLVM=ON, then topo-cli.
  #   4. reconfigure the same checkout with TOOLS + BENCHMARKS ON and run.
  # Built fresh every run (no upstream cache) so the LLVM-dependent layer can
  # never link a stale topo-llvm — slow, but acceptable for a nightly. Linux
  # only; perf NOT excluded — PassFiredMarker / pass-event equivalence prove
  # each pass took effect, and the four-way (vanilla/base/auto/forced)
  # category contracts gate timing regressions (the harness self-demotes a
  # timing ERROR to WARN under high run-to-run variance).
  benchmark:
    # The deterministic e2e (functional + equivalence + pass-fired) now gates
    # push + PR too — not just schedule/dispatch. This job runs ONLY the
    # deterministic labels (Test step: ctest -L e2e --label-exclude
    # "perf|benchmark"); the wall-clock TIMING benches stay manual/local (see
    # that step's comment), so the PR gate never pays the 40-90 min timing cost.
    # No `if:` → runs on every workflow trigger (push to main, PR, dispatch,
    # and the nightly schedule once added).
    name: benchmark + e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macos-14 mirrors build-and-test: Homebrew llvm@22 instead of the
        # bundled tarball (bundled macOS clang aborts with the __ZdaPv libc++
        # ABI mismatch). The e2e harness + backend tools select clang via
        # TOPO_LLVM_BINDIR, which cmake/llvm-detect.cmake auto-prefers from brew
        # llvm@<major> when llvm-dev/ is absent — so the pass-fired IR markers
        # are produced + read by brew clang. The bundled-LLVM cache/download
        # steps are skipped on macOS. windows-2022 uses the bundled llvm-dev
        # tarball + the bundled-clang/static-CRT pin (the same recipe the
        # build-and-test job proves); first windows iterations are blind.
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      # Pinned to dev with the top-level TOPO_CORE_REF / TOPO_LANG_CPP_REF —
      # see the comment on the workflow env block.
      TOPO_LANG_RUST_REF: dev
      TOPO_CLI_REF: dev
    steps:
      - uses: actions/checkout@v5
      # ninja + clangd are required. libpython3.11 is also required: the
      # bundled LLVM's liblldb.so (linked into topo-debug when topo-lang-cpp
      # builds with ENABLE_LLVM=ON) has a HARD link-time dependency on
      # libpython3.11.so.1.0 — linking topo-debug-cpp fails with
      # "libpython3.11.so.1.0 ... not found" + undefined refs (_Py_Dealloc …).
      # ubuntu-24.04 (noble) ships 3.12 and has no libpython3.11 in its default
      # repos, so pull it from the deadsnakes PPA. macOS dyld resolves this
      # automatically, so libpython3.11 is an ubuntu CI-only need.
      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clangd software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpython3.11

      # macOS: brew llvm@22 (clang/clangd/lldb), avoiding the bundled tarball's
      # __ZdaPv libc++ ABI defect — same handling as the build-and-test job.
      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja llvm@22

      # Point find_package(LLVM) and find_package(Clang) at brew llvm@22 for the
      # upstream LLVM-scope builds. topo-llvm itself resolves LLVM via
      # cmake/llvm-detect.cmake (brew auto-pick when llvm-dev/ is absent), but
      # the upstream topo-lang-cpp / topo-lang-rust ENABLE_LLVM builds call plain
      # find_package(LLVM), and topo-llvm's tools build calls find_package(Clang)
      # — neither has a brew fallback, so on macOS (no bundled llvm-dev) they
      # need LLVM_DIR / Clang_DIR. Same prefix llvm-detect would pick.
      - name: Point find_package(LLVM/Clang) at brew llvm@22 (macos)
        if: runner.os == 'macOS'
        run: |
          BREW_LLVM="$(brew --prefix llvm@22)"
          echo "LLVM_DIR=${BREW_LLVM}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "Clang_DIR=${BREW_LLVM}/lib/cmake/clang" >> "$GITHUB_ENV"

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Read LLVM version
        id: llvm-ver
        run: echo "version=$(tr -d '[:space:]' < .llvm-version)" >> "$GITHUB_OUTPUT"

      - name: Cache bundled LLVM
        if: runner.os != 'macOS'
        id: llvm-cache
        uses: actions/cache@v5
        with:
          path: llvm-dev
          key: llvm-dev-${{ steps.llvm-ver.outputs.version }}-${{ matrix.os }}-bench-v1

      - name: Download bundled LLVM
        if: runner.os != 'macOS' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup-llvm.sh

      # ABI + CRT consistency (Windows): pin the upstream + topo-llvm builds to
      # the SAME bundled clang AND static CRT topo-llvm uses — same rationale as
      # the build-and-test job (GNU-ABI mingw vs MSVC-ABI clang link failures;
      # /MD vs /MT RuntimeLibrary mismatch). CC/CXX are read by every subsequent
      # cmake configure; TOPO_WIN_CMAKE is appended to each (empty off-Windows).
      - name: Pin bundled clang + static CRT (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "CC=${{ github.workspace }}/llvm-dev/bin/clang.exe" >> "$GITHUB_ENV"
          echo "CXX=${{ github.workspace }}/llvm-dev/bin/clang++.exe" >> "$GITHUB_ENV"
          echo "TOPO_WIN_CMAKE=-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> "$GITHUB_ENV"

      # rustup ships on the runner image; ensure a default toolchain for the
      # topo-lang-rust LLVM scope + Rust benchmark variants.
      - run: rustup show >/dev/null 2>&1 || rustup default stable

      - name: Build & install topo-core (zero-LLVM, lang-less)
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      # lang-cpp at DEFAULT scope first — its runtime/include/topo/ headers
      # (jit.h, parallel.h, ...) are what topo-llvm's C-ABI runtime libs
      # include. LLVM-independent, so this can precede the topo-llvm build.
      - name: Build & install topo-lang-cpp (default scope, headers)
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" -B "${RUNNER_TEMP}/topo-lang-cpp-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-build" --target install

      # topo-llvm CORE from this checkout (tools OFF — they need lang-cpp/-rust
      # LLVM scope, not built yet). Installs the pass libraries that lang-cpp/
      # -rust ENABLE_LLVM link against.
      - name: Build & install topo-llvm core (tools OFF)
        run: |
          cmake -S . -B "${RUNNER_TEMP}/llvm-core-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LLVM_BUILD_TOOLS=OFF -DTOPO_LLVM_BUILD_TESTS=OFF \
              -DTOPO_LLVM_BUILD_JIT_ENGINE=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/llvm-core-build" --target install

      - name: Build & install topo-lang-cpp (ENABLE_LLVM=ON)
        run: |
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" -B "${RUNNER_TEMP}/topo-lang-cpp-llvm-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_CPP_ENABLE_LLVM=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-llvm-build" --target install

      - name: Build & install topo-lang-rust (ENABLE_LLVM=ON)
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_RUST_REF}" \
              https://github.com/topo-lang/topo-lang-rust.git "${RUNNER_TEMP}/topo-lang-rust-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-rust-src" -B "${RUNNER_TEMP}/topo-lang-rust-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_RUST_ENABLE_LLVM=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-lang-rust-build" --target install

      # topo-debug-rust runtime-attach e2e — the acceptance for the un-stub:
      # prove the Rust debug adapter launches a rustc-built target, attaches,
      # reads rustc-emitted DWARF, and answers static + runtime reduction
      # queries. Uses the just-installed topo-debug-rust + the bootstrapped
      # topo-debug against the same tiny_vector fixture the monorepo e2e uses.
      # ubuntu only: lldb pause/ptrace is unrestricted there, whereas a macOS
      # dev-lldb attach can refuse to pause an unsigned process. libpython3.11
      # (installed earlier in this job) is required by the bundled liblldb.
      - name: topo-debug-rust runtime-attach e2e
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          SRC="${RUNNER_TEMP}/topo-lang-rust-src/topo-debug/test/fixtures/tiny_vector.rs"
          BIN="${RUNNER_TEMP}/tiny_vector_rs_bin"
          rustc -C opt-level=0 -C debuginfo=2 -o "$BIN" "$SRC"
          DBG="${RUNNER_TEMP}/topo-install/bin/topo-debug"
          ADP="${RUNNER_TEMP}/topo-install/bin/topo-debug-rust"
          run_q() { "$DBG" query "$1" --break tiny_vector.rs:19 --adapter "$ADP" --target "$BIN"; }
          # static path (no pause needed)
          for pair in "shape(vec)=[8]" "dtype(vec)=f64"; do
            expr="${pair%=*}"; want="${pair#*=}"
            got="$(run_q "$expr")"
            echo "topo-debug-rust ${expr} => '${got}' (want '${want}')"
            [ "$got" = "$want" ] || { echo "FAIL: ${expr} expected '${want}', got '${got}'"; exit 1; }
          done
          # runtime path: attach + pause + read array, reduce. 0.5+1.5+..+7.5 = 32
          sumgot="$(run_q 'sum(vec)')"
          echo "topo-debug-rust sum(vec) => '${sumgot}' (want 32)"
          case "$sumgot" in
            32|32.0|32.00|32.000) ;;
            *) echo "FAIL: sum(vec) expected 32, got '${sumgot}'"; exit 1;;
          esac
          echo "topo-debug-rust runtime-attach e2e PASS"

      # topo-cli provides the `topo-build` executable the benchmark artifact
      # pre-build invokes. Installed after the lang plugins so its
      # find_package(topo-lang-*) picks them up.
      - name: Build & install topo-cli
        run: |
          git clone --depth 1 --branch "${TOPO_CLI_REF}" \
              https://github.com/topo-lang/topo-cli.git "${RUNNER_TEMP}/topo-cli-src"
          cmake -S "${RUNNER_TEMP}/topo-cli-src" -B "${RUNNER_TEMP}/topo-cli-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}
          cmake --build "${RUNNER_TEMP}/topo-cli-build" --target install

      # Reconfigure THIS checkout with tools + benchmarks ON now that lang-cpp/
      # -rust LLVM scope + topo-cli are in the prefix. BUILD_PROF is ON so the
      # relocatable-install gate below can cover topo-prof (a user-facing CLI
      # with the same libLLVM load-command defect class as the backend tools).
      - name: Configure topo-llvm (tools + benchmarks)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LLVM_BUILD_TOOLS=ON -DTOPO_LLVM_BUILD_BENCHMARKS=ON \
              -DTOPO_LLVM_BUILD_TESTS=ON -DTOPO_LLVM_BUILD_JIT_ENGINE=ON \
              -DTOPO_LLVM_BUILD_PROF=ON \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${TOPO_WIN_CMAKE}

      - name: Build
        run: cmake --build build

      # Relocatable-install gate (macOS). Proves the install-time install_name
      # rewrite (topo_relocate_llvm_rpath) makes the SHIPPED libLLVM-linked
      # artifacts loadable on a different-layout host:
      #   (1) each installed artifact loads libLLVM via @rpath, not the build
      #       host's absolute /opt/homebrew/... path, and carries NO versioned
      #       Cellar LLVM rpath (the install step canonicalizes the
      #       USE_LINK_PATH dev fallback to the stable …/opt/llvm*/lib form);
      #   (2) with the build-host rpaths removed, dyld still resolves a libLLVM
      #       bundled at the relocation rpath (@loader_path/../lib for bin/
      #       tools, @loader_path for the lib/ dylib) — i.e. genuine relocation,
      #       on a runner whose brew layout differs from the dev machine that
      #       produced the issue.
      # Covers topo-build-llvm-cpp + topo-prof (run gate: process survives
      # dyld, rc<128, no 'Library not loaded') and libtopo-jit-engine.dylib
      # (no CLI entry point — an RTLD_NOW dlopen probe of the ABSOLUTE
      # installed path forces dyld to resolve its full load graph, mirroring
      # jit-api's anchored-path search which never dlopens a bare name).
      # Installs ONLY the needed subdirs via their own cmake_install.cmake
      # (scoped + fast; avoids a full-tree install of the benchmark configure).
      - name: Verify relocatable LLVM artifacts (@rpath libLLVM) (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          PREFIX="${RUNNER_TEMP}/llvm-tools-reloc"
          for sub in tools/topo-build-llvm-cpp tools/topo-prof lib/JitEngine; do
            cmake -DCMAKE_INSTALL_PREFIX="$PREFIX" -P "build/$sub/cmake_install.cmake"
          done
          mkdir -p "$PREFIX/lib"
          cp -L "$(brew --prefix llvm@22)/lib/libLLVM.dylib" "$PREFIX/lib/"

          # (1) Static assertions on the installed Mach-O.
          assert_relocatable() { # <mach-o path>
            local f="$1"
            echo "::group::otool -L $f"; otool -L "$f"; echo "::endgroup::"
            if otool -L "$f" | grep -E '^[[:space:]]+/.*/libLLVM[^ ]*\.dylib'; then
              echo "FAIL: $f still loads libLLVM by absolute path"; exit 1
            fi
            otool -L "$f" | grep -qE '@rpath/libLLVM[^ ]*\.dylib' \
              || { echo "FAIL: $f has no @rpath/libLLVM load command"; exit 1; }
            # No exact-patch Homebrew keg may survive as an rpath — the install
            # step rewrites …/Cellar/llvm*/<ver>/lib to the stable opt form.
            if otool -l "$f" | grep -E 'path .*/Cellar/llvm[^/]*/[0-9]'; then
              echo "FAIL: $f still carries a versioned Cellar LLVM rpath"; exit 1
            fi
          }
          strip_nonloader_rpaths() { # <mach-o path>
            local f="$1"
            for rp in $(otool -l "$f" | awk '/LC_RPATH/{p=1} p&&/ path /{print $2; p=0}'); do
              case "$rp" in @loader_path*) ;; *) install_name_tool -delete_rpath "$rp" "$f" || true ;; esac
            done
            echo "rpaths of $f after stripping build-host entries:"
            otool -l "$f" | awk '/LC_RPATH/{p=1} p&&/ path /{print "  "$2; p=0}'
          }
          # (2) Cross-layout RUN gate for a bin/ tool: with only @loader_path
          # rpaths left, the tool must load + run from the bundled ../lib.
          # PASS is gated on the process surviving dyld (rc<128, no 'Library
          # not loaded'), NOT on a DYLD_PRINT_LIBRARIES line that dyld emits
          # BEFORE it validates the rest of the graph.
          run_reloc_tool() { # <tool path> <label>
            local bin="$1" label="$2" out rc
            set +e
            out="$(DYLD_PRINT_LIBRARIES=1 "$bin" --help </dev/null 2>&1)"; rc=$?
            set -e
            # Feed grep via here-string, NOT `printf "$out" | grep -q`: under
            # `set -o pipefail`, grep -q closing the pipe early makes printf die
            # of SIGPIPE and pipefail reports that 141 as the pipeline status —
            # turning a successful match into a false failure (and a real error
            # into a miss).
            grep -iE '/lib/libLLVM[^ ]*\.dylib' <<<"$out" | head -1 || true
            if grep -qiE 'Library not loaded|image not found|Symbol not found' <<<"$out"; then
              echo "FAIL: $label — dyld could not resolve a dependency from the bundled @loader_path/../lib"; exit 1
            fi
            if [ "$rc" -ge 128 ]; then
              echo "FAIL: $label died from signal (rc=$rc) — dyld load failure"; exit 1
            fi
            # Canonicalize: dyld prints the realpath (e.g. /tmp -> /private/tmp).
            local want; want="$(cd "$PREFIX/lib" && pwd -P)"
            grep -qF "$want/libLLVM" <<<"$out" \
              || { echo "FAIL: $label did not load libLLVM from the bundled ../lib ($want)"; exit 1; }
            echo "PASS: $label relocates — runs (rc=$rc) loading bundled libLLVM via @loader_path/../lib"
          }

          for tool in topo-build-llvm-cpp topo-prof; do
            BIN="$PREFIX/bin/$tool"
            assert_relocatable "$BIN"
            strip_nonloader_rpaths "$BIN"
            run_reloc_tool "$BIN" "$tool"
          done

          # libtopo-jit-engine.dylib: assert + dlopen probe. The bundled
          # libLLVM sits NEXT to the engine in lib/, so its relocation rpath
          # must be @loader_path (not the bin-tool @loader_path/../lib).
          ENGINE="$PREFIX/lib/libtopo-jit-engine.dylib"
          assert_relocatable "$ENGINE"
          otool -l "$ENGINE" | awk '/LC_RPATH/{p=1} p&&/ path /{print $2; p=0}' | grep -qx '@loader_path' \
            || { echo "FAIL: engine dylib lacks the @loader_path rpath"; exit 1; }
          strip_nonloader_rpaths "$ENGINE"
          cat > "${RUNNER_TEMP}/dlopen-probe.c" <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char** argv) {
            if (argc < 2) return 2;
            void* h = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
            if (!h) { fprintf(stderr, "dlopen failed: %s\n", dlerror()); return 1; }
            dlclose(h);
            puts("dlopen OK");
            return 0;
          }
          EOF
          cc -o "${RUNNER_TEMP}/dlopen-probe" "${RUNNER_TEMP}/dlopen-probe.c"
          set +e
          out="$(DYLD_PRINT_LIBRARIES=1 "${RUNNER_TEMP}/dlopen-probe" "$ENGINE" 2>&1)"; rc=$?
          set -e
          grep -iE '/lib/libLLVM[^ ]*\.dylib' <<<"$out" | head -1 || true
          if [ "$rc" -ne 0 ]; then
            echo "$out"
            echo "FAIL: dlopen of relocated libtopo-jit-engine.dylib failed (rc=$rc)"; exit 1
          fi
          WANT="$(cd "$PREFIX/lib" && pwd -P)"
          grep -qF "$WANT/libLLVM" <<<"$out" \
            || { echo "FAIL: engine did not load libLLVM from the bundled lib/ ($WANT)"; exit 1; }
          echo "PASS: libtopo-jit-engine.dylib relocates — dlopen(RTLD_NOW) loads bundled libLLVM via @loader_path"

      # Relocatable-install gate (Linux) — ELF analogue of the macOS gate:
      # topo_relocate_llvm_rpath appends $ORIGIN/../lib to the installed
      # RUNPATH so a libLLVM.so bundled next to the tool resolves without
      # LD_LIBRARY_PATH on a host whose LLVM lives elsewhere. Verifies:
      #   (1) the installed tool's dynamic section carries $ORIGIN/../lib
      #       (proves the cmake change actually lands on the binary);
      #   (2) with every OTHER runpath stripped (patchelf) and libLLVM.so
      #       bundled under ../lib, the tool still loads and runs — and ldd
      #       resolves libLLVM from the bundled dir, i.e. genuine relocation.
      - name: Verify relocatable backend tool ($ORIGIN libLLVM) (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq patchelf
          PREFIX="${RUNNER_TEMP}/llvm-tools-reloc"
          cmake -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -P build/tools/topo-build-llvm-cpp/cmake_install.cmake
          BIN="$PREFIX/bin/topo-build-llvm-cpp"
          echo "::group::readelf -d $BIN (dynamic section)"
          readelf -d "$BIN" | grep -E 'RUNPATH|RPATH' || true
          echo "::endgroup::"
          # (1) The installed RUNPATH must contain $ORIGIN/../lib.
          readelf -d "$BIN" | grep -E 'R(UN)?PATH' | grep -qF '$ORIGIN/../lib' \
            || { echo "FAIL: installed RUNPATH lacks \$ORIGIN/../lib"; exit 1; }
          # (2) Bundle the exact libLLVM the tool needs, strip every non-$ORIGIN
          #     runpath, and prove the tool runs resolving it from ../lib only.
          mkdir -p "$PREFIX/lib"
          need="$(ldd "$BIN" | awk '/libLLVM/{print $1; exit}')"
          src="$(ldd "$BIN" | awk '/libLLVM/{print $3; exit}')"
          if [ -z "$need" ] || [ -z "$src" ]; then
            # Statically linked LLVM on this runner: no runtime relocation to
            # prove, and (1) already pinned the RUNPATH contract.
            echo "NOTE: no shared libLLVM dependency (static link) — bundled-load proof skipped"
            exit 0
          fi
          cp -L "$src" "$PREFIX/lib/$need"
          patchelf --set-rpath '$ORIGIN/../lib' "$BIN"
          resolved="$(env -u LD_LIBRARY_PATH ldd "$BIN" | awk '/libLLVM/{print $3; exit}')"
          echo "libLLVM resolves to: $resolved"
          case "$resolved" in
            "$PREFIX/lib/"*) ;;
            *) echo "FAIL: libLLVM not resolved from the bundled ../lib"; exit 1 ;;
          esac
          env -u LD_LIBRARY_PATH "$BIN" --help </dev/null >/dev/null 2>&1 || rc=$?
          rc=${rc:-0}
          if [ "$rc" -ge 126 ]; then
            echo "FAIL: relocated binary failed to load (rc=$rc)"; exit 1
          fi
          echo "PASS: topo-build-llvm-cpp relocates — runs (rc=$rc) loading bundled libLLVM via \$ORIGIN/../lib"

      # Co-locate the per-language backend tools next to the imported topo-build
      # (from the bootstrap install). The e2e tests invoke the INSTALLED
      # topo-build (RUNNER_TEMP/topo-install/bin), which resolves backend tools
      # by (1) sibling-of-argv[0] then (2) PATH. The harness's PATH injection
      # works in the unified meta build but not here, so make sibling lookup
      # succeed deterministically by copying the just-built tools into the
      # install bin. (See issue: topo-build backend-tool PATH resolution differs
      # in the standalone bootstrap; this is the robust co-location workaround.)
      - name: Co-locate backend tools next to topo-build
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp build/tools/topo-build-llvm-cpp/topo-build-llvm-cpp${ext} \
             build/tools/topo-build-llvm-rust/topo-build-llvm-rust${ext} \
             build/tools/topo-build-llvm-mixed/topo-build-llvm-mixed${ext} \
             "${RUNNER_TEMP}/topo-install/bin/"

      # Standalone smoke for the `topo_bench_artifacts` FIXTURES_SETUP
      # provider: running the provider test by name proves it is registered in
      # a standalone configure AND that the bench prebuild pipeline works
      # end-to-end here. Linux + nightly/dispatch only — the prebuild compiles
      # every registered benchmark variant (tens of minutes), which must never
      # gate a PR (see the job comment above).
      - name: Bench-artifacts fixture provider (standalone smoke)
        if: matrix.os == 'ubuntu-24.04' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          # Same PATH defence-in-depth as the Test step: bundled llvm-dev/bin
          # (clang-22) ahead of the runner's system clang. --no-tests=error:
          # a filtered-out provider would otherwise exit 0 and the smoke
          # would be vacuous (ctest returns 0 when -R matches nothing).
          export PATH="${{ github.workspace }}/llvm-dev/bin:${PATH}"
          ctest --test-dir build -R '^topo_bench_artifacts_build$' --no-tests=error --output-on-failure

      # Deterministic gate: e2e functional + equivalence + pass-fired, with the
      # wall-clock TIMING benches EXCLUDED (--label-exclude "perf|benchmark").
      # The timing suite serializes via the topo_bench_measure resource lock and
      # runs 10 interleaved rounds per case → 40-90 min and prone to hangs on a
      # shared runner (not a reliable regression signal there), so it is NOT a
      # CI gate. Run it manually instead:
      #   ctest --test-dir build -L benchmark   # measure — the topo_bench_artifacts
      #   fixture provider pre-builds the variants first; a manual
      #   `cmake --build build --target topo-bench-artifacts` stays optional
      # Equivalence builds its variants on-demand (no pre-build needed here) and
      # proves each pass fires AND preserves behavior (timing stripped).
      # No stdlib-header shim: the benchmark Topo.toml files reference the
      # topo-lang-cpp runtime headers via a META-layout-relative path
      # (<bench>/../../../topo-lang-cpp/runtime/include) that is absent in the
      # standalone/installed layout. The equivalence harness's vanilla compile
      # now injects the install-prefix include — baked in from find_path as the
      # TOPO_LANG_CPP_RUNTIME_INCLUDE define — so <topo/*.h> resolves without a
      # symlink shim. See test/e2e/E2eHarness.cpp::appendStdlibPrefixInclude.
      # Put the bundled llvm-dev/bin (clang-22, the SAME LLVM linked into the
      # backend tools) ahead of the runner's system clang-18 on PATH. The
      # backend tools now resolve their own bundled clang directly (the
      # resolveBundledClangxx fix), so this is defence-in-depth: it guarantees
      # the IR producer and the link-step reader share a major version even if
      # a build path ever falls back to a bare `clang++` lookup. Without it the
      # link reads LLVM-22 IR with system clang-18 → `Unknown attribute kind` /
      # `linking failed`.
      - name: Test (e2e equivalence + pass-fired; timing excluded)
        run: |
          # Put the IR producer's clang ahead on PATH (defence-in-depth): brew
          # llvm@22 on macOS, the bundled llvm-dev/bin (clang-22) elsewhere.
          if [ "${RUNNER_OS}" = "macOS" ]; then
            export PATH="$(brew --prefix llvm@22)/bin:${PATH}"
          else
            export PATH="${{ github.workspace }}/llvm-dev/bin:${PATH}"
          fi
          ctest --test-dir build -L e2e --label-exclude "perf|benchmark" --output-on-failure --timeout 300
