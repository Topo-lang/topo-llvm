name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly benchmark + e2e run (the `benchmark` job below). 18:03 UTC
  # ≈ 02:03 China time; staggered minute to dodge the top-of-hour scheduler
  # backlog. Scheduled runs always use the workflow file on the default
  # branch, so this fires only once merged to main.
  schedule:
    - cron: '3 18 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOPO_CORE_REF: main
  # topo-llvm core links topo::core::TopoBuildLib (lib/Build) which is
  # gated behind find_package(topo-lang) in topo-core. Install topo-lang
  # too so the topo-core re-install includes lib/Build in its export.
  TOPO_LANG_REF: main
  # topo-llvm's C-ABI runtime libs (runtime/topo_jit_api.cpp,
  # topo_adaptive.cpp, topo_parallel.cpp, ...) #include <topo/jit.h>,
  # <topo/parallel.h>, <topo/adaptive.h> — these headers physically live
  # in topo-lang-cpp/runtime/include/topo/ and are always installed under
  # the default scope. find_path(TOPO_LANG_CPP_RUNTIME_INCLUDE) in
  # topo-llvm/CMakeLists.txt picks them up from the install prefix.
  TOPO_LANG_CPP_REF: main

jobs:
  # ── Core scope build + test ────────
  # Builds the LLVM IR pass + Backend + Decompile + JitEngine + C-ABI
  # runtime libs (the topo-llvm core scope landed in the phase-4 lift).
  # Backend tools (topo-build-llvm-{cpp,rust,mixed}) live behind
  # TOPO_LLVM_BUILD_TOOLS=ON and reverse-link topo-lang-cpp / -rust's
  # LLVM scope; not exercised here to keep CI scope manageable.
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macos-14 uses Homebrew llvm@22 instead of the bundled tarball:
        # bundled `LLVM-22.1.1-macOS-ARM64.tar.xz` clang aborts during
        # cmake's compiler check with `dyld: Symbol not found: __ZdaPv →
        # Abort trap: 6` (libc++ ABI mismatch). Brew-installed llvm@22
        # links against the runner's libc++ and works. The bundled-LLVM
        # download/cache steps below are skipped on macOS, and topo-llvm's
        # cmake/llvm-detect.cmake auto-prefers brew llvm@<major> when
        # llvm-dev/ is absent. Apple clang from Xcode CLT drives cmake's
        # compiler probe (the bundled-clang auto-pick in CMakeLists.txt:7
        # is gated on EXISTS llvm-dev/bin/clang++).
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja llvm@22

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Read LLVM version
        id: llvm-ver
        run: echo "version=$(tr -d '[:space:]' < .llvm-version)" >> "$GITHUB_OUTPUT"

      # The bundled LLVM tarball is ~1 GB; caching it keeps PR builds
      # workable. Keyed on .llvm-version so a version bump invalidates.
      # Skipped on macOS — Homebrew llvm@22 is used instead (see matrix
      # comment above); bundled clang ABI is incompatible with the
      # macos-14 runner's libc++.
      - name: Cache bundled LLVM
        if: runner.os != 'macOS'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: llvm-dev
          key: llvm-dev-${{ steps.llvm-ver.outputs.version }}-${{ matrix.os }}-v1

      - name: Download bundled LLVM
        if: runner.os != 'macOS' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup-llvm.sh

      - name: Cache upstream installs
        id: upstream-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/topo-install
          key: topo-upstream-${{ env.TOPO_CORE_REF }}-${{ env.TOPO_LANG_REF }}-${{ env.TOPO_LANG_CPP_REF }}-${{ matrix.os }}-v3-pic

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      # Re-install topo-core to flip TOPO_CORE_WITH_LANG ON now that
      # topo-lang is discoverable in the prefix. This wires lib/Build +
      # lib/Transpile (PUBLIC-dep on topo::lang::TopoLang) into the
      # TopoCoreTargets export set, which topo-llvm core needs
      # (TopoBackend links topo::core::TopoBuildLib).
      - name: Re-install topo-core (with-lang)
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      # Install topo-lang-cpp at its default scope (ENABLE_LLVM=OFF) — we
      # only need its runtime/include/topo/ headers (parallel.h, jit.h,
      # adaptive.h, ...) which the topo-llvm C-ABI runtime libs include.
      - name: Build & install topo-lang-cpp (default scope)
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git \
              "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" \
                -B "${RUNNER_TEMP}/topo-lang-cpp-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-build" --target install

      - name: Configure topo-llvm (core scope, tools=OFF)
        run: |
          # CI gates per-platform:
          # - Linux: BUILD_TESTS=ON (--start-group/--end-group wrapper added
          #   2026-05-28 resolves the TopoTransforms↔TopoBackend cycle for
          #   GNU ld) and BUILD_JIT_ENGINE=ON (LLVMSupport libzstd.a→-lzstd
          #   substitution in cmake/llvm-detect.cmake bypasses the non-PIC
          #   restriction for SHARED targets).
          # - Windows: still gated OFF — lld-link's response-file expansion
          #   fails for both targets (separate root cause, separate fix).
          if [ "$RUNNER_OS" = "Linux" ]; then
            TESTS_FLAG=-DTOPO_LLVM_BUILD_TESTS=ON
            JIT_FLAG=-DTOPO_LLVM_BUILD_JIT_ENGINE=ON
          else
            TESTS_FLAG=-DTOPO_LLVM_BUILD_TESTS=OFF
            JIT_FLAG=-DTOPO_LLVM_BUILD_JIT_ENGINE=OFF
          fi
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              $JIT_FLAG \
              $TESTS_FLAG

      - name: Build
        run: cmake --build build

      # 400 unit + integration tests; e2e suite excluded (needs topo-build
      # CLI from topo-cli + the deferred benchmark/e2e fixture trees).
      - name: Test
        # Linux: TESTS=ON, runs ~400 unit + integration cases.
        # Windows: TESTS=OFF, ctest sees no targets — --no-tests=ignore
        # keeps the step green until the lld-link fix lands.
        run: ctest --test-dir build -E "e2e" --output-on-failure --timeout 180 --no-tests=ignore

      - name: Install topo-llvm
        run: cmake --install build --prefix "${RUNNER_TEMP}/llvm-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          # The smoke project needs its own vcpkg manifest: the installed
          # package's Config.cmake chain transitively requires nlohmann_json,
          # so the consumer must arrange for that dep itself. Pinning the
          # same builtin-baseline reuses the cached vcpkg build.
          cat > vcpkg.json <<'JSON'
          {
            "name": "find-package-smoke",
            "version-string": "0.0.0",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          # Enable C as well: on macOS, brew llvm's LLVMConfig.cmake
          # transitively find_package(LibEdit), and FindLibEdit calls
          # check_include_file(histedit.h ...) which requires C enabled.
          project(topo-llvm-find-package-smoke LANGUAGES C CXX)
          find_package(topo-llvm CONFIG REQUIRED)
          add_executable(smoke smoke.cpp)
          # topo-arena is a pure C-ABI archive — links cleanly without
          # dragging the LLVM static archives the pass libraries pull in.
          target_link_libraries(smoke PRIVATE topo::llvm::topo-arena)
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include <topo/rt/arena_rt.h>
          int main() {
              topo_arena_t a = topo_arena_create(1024);
              topo_arena_destroy(a);
              return 0;
          }
          CPP
          # On Windows the GHA runner's PATH puts mingw64 ld ahead of
          # MSVC's link.exe, and CMake's Ninja generator silently picks
          # the first one for an unspecified CXX. topo-arena.lib was
          # built with MSVC-ABI clang from llvm-dev/, so mingw64 ld
          # can't resolve operator new/delete (??2@YAPEAX_K@Z etc).
          # Pin the smoke project to the same bundled clang the upstream
          # build used.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            CC_FLAG="-DCMAKE_C_COMPILER=${{ github.workspace }}/llvm-dev/bin/clang.exe"
            CXX_FLAG="-DCMAKE_CXX_COMPILER=${{ github.workspace }}/llvm-dev/bin/clang++.exe"
            LLVM_PREFIX="${{ github.workspace }}/llvm-dev"
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            # macOS uses Homebrew llvm@22 instead of the bundled tarball
            # (see matrix comment at top); point find_dependency(LLVM) at it.
            CC_FLAG=""
            CXX_FLAG=""
            LLVM_PREFIX="$(brew --prefix llvm@22)"
          else
            CC_FLAG=""
            CXX_FLAG=""
            LLVM_PREFIX="${{ github.workspace }}/llvm-dev"
          fi
          cmake -S . -B build -G Ninja \
              ${CC_FLAG} ${CXX_FLAG} \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/llvm-install;${RUNNER_TEMP}/topo-install;${LLVM_PREFIX}" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          ./build/smoke

  # ── Benchmark + e2e gate (schedule + manual only) ──────
  # The 41 LLVM-IR pass benchmarks + the IR/output-equivalence suite. Gated
  # to schedule / workflow_dispatch so it never adds its tens of minutes to a
  # PR. Heavier bootstrap than build-and-test: the e2e artifacts are built by
  # topo-cli's `topo-build`, and TOPO_LLVM_BUILD_TOOLS (topo-build-llvm-mixed)
  # reverse-links topo-lang-cpp / -rust's LLVM scope — the cpp/rust↔llvm
  # gating loop. We break it the way the bootstrap order prescribes
  # (llvm core → lang-cpp/-rust with ENABLE_LLVM → llvm tools):
  #   1. topo-core + topo-lang + topo-lang-cpp at DEFAULT scope (the runtime
  #      headers topo-llvm's C-ABI libs include; all LLVM-independent).
  #   2. topo-llvm CORE from THIS checkout → install, so lang-cpp/-rust's
  #      find_package(topo-llvm) resolves.
  #   3. lang-cpp + lang-rust with ENABLE_LLVM=ON, then topo-cli.
  #   4. reconfigure the same checkout with TOOLS + BENCHMARKS ON and run.
  # Built fresh every run (no upstream cache) so the LLVM-dependent layer can
  # never link a stale topo-llvm — slow, but acceptable for a nightly. Linux
  # only; perf NOT excluded — PassFiredMarker / pass-event equivalence prove
  # each pass took effect, and the four-way (vanilla/base/auto/forced)
  # category contracts gate timing regressions (the harness self-demotes a
  # timing ERROR to WARN under high run-to-run variance).
  benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: benchmark + e2e (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      TOPO_LANG_RUST_REF: main
      TOPO_CLI_REF: main
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clangd

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Read LLVM version
        id: llvm-ver
        run: echo "version=$(tr -d '[:space:]' < .llvm-version)" >> "$GITHUB_OUTPUT"

      - name: Cache bundled LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: llvm-dev
          key: llvm-dev-${{ steps.llvm-ver.outputs.version }}-ubuntu-24.04-bench-v1

      - name: Download bundled LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup-llvm.sh

      # rustup ships on the runner image; ensure a default toolchain for the
      # topo-lang-rust LLVM scope + Rust benchmark variants.
      - run: rustup show >/dev/null 2>&1 || rustup default stable

      - name: Build & install topo-core (zero-LLVM, lang-less)
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      # lang-cpp at DEFAULT scope first — its runtime/include/topo/ headers
      # (jit.h, parallel.h, ...) are what topo-llvm's C-ABI runtime libs
      # include. LLVM-independent, so this can precede the topo-llvm build.
      - name: Build & install topo-lang-cpp (default scope, headers)
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" -B "${RUNNER_TEMP}/topo-lang-cpp-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-build" --target install

      # topo-llvm CORE from this checkout (tools OFF — they need lang-cpp/-rust
      # LLVM scope, not built yet). Installs the pass libraries that lang-cpp/
      # -rust ENABLE_LLVM link against.
      - name: Build & install topo-llvm core (tools OFF)
        run: |
          cmake -S . -B "${RUNNER_TEMP}/llvm-core-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LLVM_BUILD_TOOLS=OFF -DTOPO_LLVM_BUILD_TESTS=OFF \
              -DTOPO_LLVM_BUILD_JIT_ENGINE=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/llvm-core-build" --target install

      - name: Build & install topo-lang-cpp (ENABLE_LLVM=ON)
        run: |
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" -B "${RUNNER_TEMP}/topo-lang-cpp-llvm-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_CPP_ENABLE_LLVM=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-llvm-build" --target install

      - name: Build & install topo-lang-rust (ENABLE_LLVM=ON)
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_RUST_REF}" \
              https://github.com/topo-lang/topo-lang-rust.git "${RUNNER_TEMP}/topo-lang-rust-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-rust-src" -B "${RUNNER_TEMP}/topo-lang-rust-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_RUST_ENABLE_LLVM=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-rust-build" --target install

      # topo-cli provides the `topo-build` executable the benchmark artifact
      # pre-build invokes. Installed after the lang plugins so its
      # find_package(topo-lang-*) picks them up.
      - name: Build & install topo-cli
        run: |
          git clone --depth 1 --branch "${TOPO_CLI_REF}" \
              https://github.com/topo-lang/topo-cli.git "${RUNNER_TEMP}/topo-cli-src"
          cmake -S "${RUNNER_TEMP}/topo-cli-src" -B "${RUNNER_TEMP}/topo-cli-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-cli-build" --target install

      # Reconfigure THIS checkout with tools + benchmarks ON now that lang-cpp/
      # -rust LLVM scope + topo-cli are in the prefix.
      - name: Configure topo-llvm (tools + benchmarks)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${{ github.workspace }}/llvm-dev" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LLVM_BUILD_TOOLS=ON -DTOPO_LLVM_BUILD_BENCHMARKS=ON \
              -DTOPO_LLVM_BUILD_TESTS=ON -DTOPO_LLVM_BUILD_JIT_ENGINE=ON \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build
        run: cmake --build build

      - name: Build benchmark artifacts
        run: cmake --build build --target topo-bench-artifacts

      - name: Test (e2e + benchmarks)
        run: ctest --test-dir build -L e2e --output-on-failure --timeout 600
